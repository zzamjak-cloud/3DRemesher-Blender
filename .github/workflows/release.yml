name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: dist
      - name: 태그와 설치 ZIP 버전 확인
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/prepare_release.py
      - name: GitHub Release 게시
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "3D Remesher $RELEASE_TAG" --notes-file dist/release-notes.md
