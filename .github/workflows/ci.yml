name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python 정적 검사와 단위 검사
        run: |
          python scripts/verify_project.py
          python -m unittest discover -s tests -p 'test_*.py'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 4.2.0
            series: '4.2'
          - version: 5.2.0
            series: '5.2'
    env:
      BLENDER_VERSION: ${{ matrix.version }}
      BLENDER_SERIES: ${{ matrix.series }}
      BLENDER_ARCHIVE: blender-${{ matrix.version }}-linux-x64.tar.xz
      BLENDER_URL: https://download.blender.org/release/Blender${{ matrix.series }}/blender-${{ matrix.version }}-linux-x64.tar.xz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Blender LTS 다운로드
        run: |
          curl -fL "$BLENDER_URL" -o "$RUNNER_TEMP/$BLENDER_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/$BLENDER_ARCHIVE" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "BLENDER_BINARY=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Extension 빌드 및 공식 검증
        run: python scripts/build_extension.py --blender-binary "$BLENDER_BINARY"

      - name: Blender 등록 및 엔진 통합 검증
        run: |
          profile="$RUNNER_TEMP/3DRemesherDev/$BLENDER_SERIES"
          repo_dir="$profile/extensions/user_default"
          mkdir -p "$repo_dir" "$profile/config" "$profile/scripts" "$profile/datafiles"
          ln -s "$GITHUB_WORKSPACE" "$repo_dir/zzamjak_3d_remesher"
          BLENDER_USER_RESOURCES="$profile" \
          BLENDER_USER_CONFIG="$profile/config" \
          BLENDER_USER_SCRIPTS="$profile/scripts" \
          BLENDER_USER_DATAFILES="$profile/datafiles" \
          BLENDER_USER_EXTENSIONS="$profile/extensions" \
          REMESHER_DEV_ROOT="$GITHUB_WORKSPACE" \
          REMESHER_DEV_PROFILE="$profile" \
          REMESHER_EXTENSION_ID="zzamjak_3d_remesher" \
          "$BLENDER_BINARY" --background --python-exit-code 1 --python scripts/dev_bootstrap.py --python tests/blender_smoke.py --python tests/blender_engine.py --python tests/blender_acceptance.py --python tests/blender_large_mesh.py

      - name: 검증한 설치 ZIP 보관
        if: matrix.version == '5.2.0'
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/zzamjak_3d_remesher-v*.zip
          if-no-files-found: error
